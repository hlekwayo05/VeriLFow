<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>VeriFlow - Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/veriflow-mobile.css?v=7"/>
  <link rel="stylesheet" href="../css/auth-onboarding.css?v=14"/>
  <style>
    .login-flow .page { padding-top: 0; min-height: 100vh; }
    .auth-page { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
    .auth-left { position: relative; min-height: 100vh; overflow: hidden; background: var(--brand-bg); }
    .auth-brand-fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center; padding: 48px; }
    .auth-right { display: flex; flex-direction: column; justify-content: center; padding: 80px 60px; background: var(--paper-2); }
    .auth-form-wrap { max-width: 400px; width: 100%; margin: 0 auto; }
    .auth-title { font-family: 'Space Grotesk', 'DM Sans', sans-serif; font-size: 28px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; margin-bottom: 6px; }
    .auth-sub { font-size: 14px; color: var(--ink-3); margin-bottom: 36px; line-height: 1.65; }
    .auth-footer { margin-top: 24px; font-size: 13px; color: var(--ink-4); text-align: center; }
    .auth-footer a { color: var(--ink); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
    .auth-success { display: none; background: #eef3f0; border: 1px solid #e4e8e3; border-radius: 14px; padding: 16px; font-size: 13px; color: var(--ink-3); line-height: 1.6; margin-bottom: 20px; }
    .auth-success.visible { display: block; }
    .login-flow label { font-family: 'JetBrains Mono', 'DM Mono', monospace; }
    .auth-login-btn { position: relative; z-index: 0; overflow: hidden; border: none; margin-top: 8px; background: var(--ink); color: #fff; }
    .auth-login-btn-label { position: relative; z-index: 2; display: inline-flex; align-items: center; gap: 8px; }
  </style>
</head>
<body class="login-flow">

<main class="page">
  <div class="auth-page">
    <div class="auth-left">
      <img src="../images/veriflo-brand.png" alt="veriflo - Accurate. Timely. Transparent." class="auth-brand-fill" decoding="async"/>
    </div>

    <div class="auth-right">
      <div class="auth-form-wrap">
        <div class="auth-title">Forgot password?</div>
        <p class="auth-sub">Enter your email address and we’ll send you a link to reset your password.</p>

        <div class="auth-success" id="forgotSuccess">
          If an account exists for that email, a password reset link has been sent. Check your inbox and spam folder.
        </div>

        <form id="forgotForm" onsubmit="handleForgotPassword(event)" novalidate>
          <div class="form-group" id="grp-email">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="230383025@ump.ac.za" autocomplete="email"/>
            <div class="form-error">Please enter a valid email address.</div>
          </div>
          <button type="submit" class="btn btn-ink btn-full auth-login-btn" id="forgotBtn">
            <span class="auth-login-btn-label">Send reset link <i class="ti ti-mail"></i></span>
          </button>
        </form>

        <div class="auth-footer">
          Remember your password? <a href="login.html">Back to log in</a>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="../js/app.js?v=17"></script>
<script>
  VF.pageIn();

  async function handleForgotPassword(e) {
    e.preventDefault();
    const valid = VF.validateForm([
      { id: 'email', check: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v), msg: 'Please enter a valid email address.' },
    ]);
    if (!valid) return;

    const btn = document.getElementById('forgotBtn');
    const originalHTML = btn.innerHTML;
    btn.innerHTML = '<span class="auth-login-btn-label"><div class="spinner" style="width:18px;height:18px;border-width:2px"></div> Sending…</span>';
    btn.classList.add('btn-disabled');

    try {
      await VF.apiFetch('/auth/forgot-password', {
        method: 'POST',
        body: { email: document.getElementById('email').value.trim() },
      });

      document.getElementById('forgotForm').style.display = 'none';
      document.getElementById('forgotSuccess').classList.add('visible');
    } catch (err) {
      btn.innerHTML = originalHTML;
      btn.classList.remove('btn-disabled');
      VF.toast(err.errors ? err.errors[0] : 'Could not send reset link. Please try again.', 'err');
    }
  }
</script>
</body>
</html>
