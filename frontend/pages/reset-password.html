<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>VeriFlow - Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/veriflow-mobile.css?v=7"/>
  <link rel="stylesheet" href="../css/auth-onboarding.css?v=14"/>
  <style>
    .login-flow .page { padding-top: 0; min-height: 100vh; }
    .auth-page { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
    .auth-left { position: relative; min-height: 100vh; overflow: hidden; background: var(--brand-bg); }
    .auth-brand-fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center; padding: 48px; }
    .auth-right { display: flex; flex-direction: column; justify-content: center; padding: 80px 60px; background: var(--paper-2); }
    .auth-form-wrap { max-width: 400px; width: 100%; margin: 0 auto; }
    .auth-title { font-family: 'Space Grotesk', 'DM Sans', sans-serif; font-size: 28px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; margin-bottom: 6px; }
    .auth-sub { font-size: 14px; color: var(--ink-3); margin-bottom: 20px; line-height: 1.65; }
    .auth-footer { margin-top: 24px; font-size: 13px; color: var(--ink-4); text-align: center; }
    .auth-footer a { color: var(--ink); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
    .login-flow label { font-family: 'JetBrains Mono', 'DM Mono', monospace; }
    .auth-login-btn { position: relative; z-index: 0; overflow: hidden; border: none; margin-top: 8px; background: var(--ink); color: #fff; }
    .auth-login-btn-label { position: relative; z-index: 2; display: inline-flex; align-items: center; gap: 8px; }
  </style>
</head>
<body class="login-flow">

<main class="page">
  <div class="auth-page">
    <div class="auth-left">
      <img src="../images/veriflo-brand.png" alt="veriflo - Accurate. Timely. Transparent." class="auth-brand-fill" decoding="async"/>
    </div>

    <div class="auth-right">
      <div class="auth-form-wrap">
        <div class="auth-title">Set a new password</div>
        <p class="auth-sub">Choose a strong password for your VeriFlow account.</p>

        <form id="resetForm" onsubmit="handleResetPassword(event)" novalidate>
          <div class="form-group" id="grp-password">
            <label for="password">New password</label>
            <input type="password" id="password" placeholder="Create a strong password" autocomplete="new-password"/>
            <div class="form-hint">At least 8 characters, with uppercase, lowercase, a number, and a special character.</div>
            <ul class="pwd-checklist" id="pwdChecklist" aria-live="polite"></ul>
            <div class="form-error">Password is not strong enough.</div>
          </div>
          <div class="form-group" id="grp-confirmPassword">
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter your new password" autocomplete="new-password"/>
            <div class="form-error">Passwords do not match.</div>
          </div>
          <button type="submit" class="btn btn-ink btn-full auth-login-btn" id="resetBtn">
            <span class="auth-login-btn-label">Update password <i class="ti ti-arrow-right"></i></span>
          </button>
        </form>

        <div class="auth-footer">
          <a href="login.html">Back to log in</a>
          ·
          <a href="forgot-password.html">Request a new link</a>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="../js/app.js?v=17"></script>
<script>
  VF.pageIn();

  const params = new URLSearchParams(window.location.search);
  const resetToken = params.get('token');

  if (!resetToken) {
    VF.toast('This reset link is invalid. Please request a new one.', 'err');
    setTimeout(() => { window.location.href = 'forgot-password.html'; }, 1200);
  }

  VF.bindPasswordChecklist('password', 'pwdChecklist');

  async function handleResetPassword(e) {
    e.preventDefault();
    if (!resetToken) return;

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    const valid = VF.validateForm([
      { id: 'password', check: v => VF.isStrongPassword(v), msg: VF.passwordErrorMessage(password) || 'Password is not strong enough.' },
      { id: 'confirmPassword', check: v => v === password, msg: 'Passwords do not match.' },
    ]);
    if (!valid) return;

    const btn = document.getElementById('resetBtn');
    const originalHTML = btn.innerHTML;
    btn.innerHTML = '<span class="auth-login-btn-label"><div class="spinner" style="width:18px;height:18px;border-width:2px"></div> Updating…</span>';
    btn.classList.add('btn-disabled');

    try {
      await VF.apiFetch('/auth/reset-password', {
        method: 'POST',
        body: { token: resetToken, password, confirmPassword },
      });

      VF.toast('Password updated. You can now log in.', 'ok');
      setTimeout(() => { window.location.href = 'login.html'; }, 900);
    } catch (err) {
      btn.innerHTML = originalHTML;
      btn.classList.remove('btn-disabled');
      VF.toast(err.errors ? err.errors[0] : 'Could not reset password. Please try again.', 'err');
    }
  }
</script>
</body>
</html>
