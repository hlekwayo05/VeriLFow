<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>VeriFlow — Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <link rel="stylesheet" href="../css/veriflow-mobile.css?v=7"/>
  <link rel="stylesheet" href="../css/auth-onboarding.css?v=14"/>
  <style>
    .login-flow .page {
      padding-top: 0;
      min-height: 100vh;
    }

    .auth-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .auth-left {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background: var(--brand-bg);
    }

    .auth-badge {
      display: none;
    }

    .auth-wave {
      display: none;
    }

    .auth-brand-fill {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      padding: 48px;
    }

    .auth-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 60px;
      background: var(--paper-2);
    }

    .auth-form-wrap {
      max-width: 400px;
      width: 100%;
      margin: 0 auto;
    }

    .auth-title {
      font-family: 'Space Grotesk', 'DM Sans', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }

    .auth-sub {
      font-size: 14px;
      color: var(--ink-3);
      margin-bottom: 36px;
      line-height: 1.65;
    }

    .auth-footer {
      margin-top: 24px;
      font-size: 13px;
      color: var(--ink-4);
      text-align: center;
    }

    .auth-footer a {
      color: var(--ink);
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .login-flow label {
      font-family: 'JetBrains Mono', 'DM Mono', monospace;
    }

    /* Focus glow on inputs (desktop) */
    @property --login-field-glow {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes loginFieldGlowSpin {
      to { --login-field-glow: 360deg; }
    }

    .login-flow .form-group input:focus {
      border: 2px solid transparent;
      box-shadow: none;
      outline: none;
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--paper), var(--paper)),
        conic-gradient(
          from var(--login-field-glow),
          var(--border-2) 0%,
          var(--border-2) 58%,
          rgba(159, 212, 200, 0.45) 72%,
          #ffffff 86%,
          #9fd4c8 93%,
          var(--border-2) 100%
        );
      background-origin: border-box;
      background-clip: padding-box, border-box;
      animation: loginFieldGlowSpin 2.2s linear infinite;
    }

    .login-flow .form-group.error input:focus {
      background-image:
        linear-gradient(var(--paper), var(--paper)),
        conic-gradient(
          from var(--login-field-glow),
          #e8b4b4 0%,
          #e8b4b4 58%,
          rgba(255, 255, 255, 0.85) 78%,
          var(--err) 90%,
          #e8b4b4 100%
        );
    }

    .auth-login-btn {
      position: relative;
      z-index: 0;
      overflow: hidden;
      border: none;
      margin-top: 8px;
      background: var(--ink);
      color: #fff;
    }

    .auth-login-btn-label {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .auth-login-btn::before {
      content: "";
      position: absolute;
      inset: -40%;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 240deg,
        rgba(255, 255, 255, 0.15) 270deg,
        rgba(255, 255, 255, 0.95) 310deg,
        #9fd4c8 335deg,
        transparent 360deg
      );
      z-index: 0;
      animation: authBtnGlowSpin 2.2s linear infinite;
      pointer-events: none;
    }

    .auth-login-btn::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: calc(var(--r-lg) - 1px);
      background: var(--ink);
      z-index: 1;
      pointer-events: none;
      transition: background 0.18s ease;
    }

    .auth-login-btn:hover {
      background: var(--ink);
      transform: none;
      box-shadow: none;
    }

    .auth-login-btn:hover::after {
      background: var(--ink-2);
    }

    .auth-login-btn:active {
      transform: none;
      box-shadow: none;
    }

    @keyframes authBtnGlowSpin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .login-flow .form-group input:focus {
        animation: none;
        border-color: var(--ink);
        background-image: none;
        box-shadow: 0 0 0 3px rgba(61, 107, 115, 0.12);
      }

      .auth-login-btn::before {
        animation: none !important;
        opacity: 0 !important;
      }
    }
  </style>
</head>
<body class="login-flow">

<main class="page">
  <div class="auth-page">
    <div class="auth-left">
      <span class="auth-badge">Student portal</span>
      <img
        src="../images/veriflo-brand.png"
        alt="veriflo — Accurate. Timely. Transparent."
        class="auth-brand-fill"
        decoding="async"
      />
      <svg class="auth-wave" viewBox="0 0 390 34" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <filter id="authWaveGlow" x="-10%" y="-120%" width="120%" height="280%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <path
          class="auth-wave-glow"
          fill="none"
          stroke="#9fd4c8"
          stroke-width="2.5"
          stroke-linecap="round"
          filter="url(#authWaveGlow)"
          d="M0,20 C80,45 160,0 195,10 C260,26 320,0 390,18"
        />
        <path class="auth-wave-fill" fill="#f2f4f1" d="M0,20 C80,45 160,0 195,10 C260,26 320,0 390,18 L390,34 L0,34 Z"/>
      </svg>
    </div>

    <div class="auth-right">
      <div class="auth-form-wrap">
        <div class="auth-title">Welcome back</div>
        <p class="auth-sub">Log in to check your application status or continue where you left off.</p>

        <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
          <div class="form-group" id="grp-email">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="230383025@ump.ac.za" autocomplete="email"/>
            <div class="form-error">Please enter a valid email address.</div>
          </div>
          <div class="form-group" id="grp-password">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Your password" autocomplete="current-password"/>
            <div class="form-error">Please enter your password.</div>
          </div>
          <button type="submit" class="btn btn-ink btn-full auth-login-btn" id="loginBtn">
            <span class="auth-login-btn-label">Log in <i class="ti ti-arrow-right"></i></span>
          </button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="apply-step1.html" id="applyNowLink">Apply now</a>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="../js/app.js?v=17"></script>
<script>
  VF.pageIn();

  // Already logged in — send tutors to the right place without showing the form again
  if (VF.isAuthenticated()) {
    const token = VF.getToken();
    try {
      const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
      if (payload.tempFlag && (payload.role === 'lecturer' || payload.role === 'tutor')) {
        VF.navigate('change-password.html');
      } else if (payload.role === 'tutor') {
        VF.routeTutor(VF.resolveTutorRoute());
        VF.fetchTutorRouteState().catch(() => {});
      }
    } catch (e) { /* ignore */ }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const valid = VF.validateForm([
      { id: 'email',    check: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v), msg: 'Please enter a valid email address.' },
      { id: 'password', check: v => v.length >= 1,                         msg: 'Please enter your password.' },
    ]);
    if (!valid) return;

    const btn = document.getElementById('loginBtn');
    const originalHTML = btn.innerHTML;
    btn.innerHTML = '<span class="auth-login-btn-label"><div class="spinner" style="width:18px;height:18px;border-width:2px"></div> Logging in…</span>';
    btn.classList.add('btn-disabled');

    try {
      const data = await VF.apiFetch('/auth/login', {
        method: 'POST',
        body: {
          email:    document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        },
      });

      // Store the JWT — this is what keeps the user logged in
      VF.clearState();
      VF.setToken(data.token);

      const tutorRoute = {
        applicationStatus: data.applicationStatus ?? null,
        onboardingComplete: !!data.onboardingComplete,
      };

      // Keep user + routing state for navbar and later page loads
      VF.setState({
        user: {
          email:      document.getElementById('email').value.trim(),
          firstNames: data.firstName || '',
          surname:    data.surname   || '',
          initials:   VF.initials(data.firstName || '', data.surname || ''),
          title:      '',
          cell:       '',
        },
        applicationStatus: tutorRoute.applicationStatus,
        academic: null,
        onboarding: {
          step1: tutorRoute.onboardingComplete,
          step2: tutorRoute.onboardingComplete,
        },
      });

      // ── Route based on real API response ──
      if (data.tempFlag && (data.role === 'lecturer' || data.role === 'tutor')) {
        VF.navigate('change-password.html');
      } else if (data.role === 'admin') {
        VF.navigate('admin-dashboard.html');
      } else if (data.role === 'lecturer') {
        VF.navigate('lecturer-dashboard.html');
      } else {
        // Tutor — route immediately from login response (do not wait on a second API call)
        VF.routeTutor(tutorRoute);
        VF.fetchTutorRouteState().catch(() => {});
      }

    } catch (err) {
      btn.innerHTML = originalHTML;
      btn.classList.remove('btn-disabled');
      VF.toast(err.errors ? err.errors[0] : 'Login failed. Please try again.', 'err');
    }
  }
</script>
</body>
</html>
