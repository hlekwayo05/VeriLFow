<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>VeriFlow — Change Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
  <link rel="stylesheet" href="../css/main.css"/>
  <style>
    .login-flow .page {
      padding-top: 0;
      min-height: 100vh;
    }

    .auth-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .auth-left {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background: var(--brand-bg);
    }

    .auth-badge {
      display: none;
    }

    .auth-wave {
      display: none;
    }

    .auth-brand-fill {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      padding: 48px;
    }

    .auth-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 60px;
      background: var(--paper-2);
    }

    .auth-form-wrap {
      max-width: 400px;
      width: 100%;
      margin: 0 auto;
    }

    .auth-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -1px;
      margin-bottom: 6px;
    }

    .auth-sub {
      font-size: 14px;
      color: var(--ink-3);
      margin-bottom: 36px;
      line-height: 1.65;
    }

    .auth-notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--paper-3);
      border: 1px solid var(--paper-4);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 28px;
      font-size: 13px;
      color: var(--ink-3);
      line-height: 1.5;
    }

    .auth-notice i {
      font-size: 16px;
      margin-top: 1px;
      color: var(--ink);
    }

    .auth-footer {
      margin-top: 24px;
      font-size: 13px;
      color: var(--ink-4);
      text-align: center;
    }

    .auth-footer a {
      color: var(--ink);
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* Focus glow on inputs */
    @property --login-field-glow {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes loginFieldGlowSpin {
      to { --login-field-glow: 360deg; }
    }

    .login-flow .form-group input:focus {
      border: 2px solid transparent;
      box-shadow: none;
      outline: none;
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--paper), var(--paper)),
        conic-gradient(
          from var(--login-field-glow),
          var(--border-2) 0%,
          var(--border-2) 58%,
          rgba(159, 212, 200, 0.45) 72%,
          #ffffff 86%,
          #9fd4c8 93%,
          var(--border-2) 100%
        );
      background-origin: border-box;
      background-clip: padding-box, border-box;
      animation: loginFieldGlowSpin 2.2s linear infinite;
    }

    .login-flow .form-group.error input:focus {
      background-image:
        linear-gradient(var(--paper), var(--paper)),
        conic-gradient(
          from var(--login-field-glow),
          #e8b4b4 0%,
          #e8b4b4 58%,
          rgba(255, 255, 255, 0.85) 78%,
          var(--err) 90%,
          #e8b4b4 100%
        );
    }

    /* Submit button — traveling glow */
    .auth-login-btn {
      position: relative;
      z-index: 0;
      isolation: isolate;
      overflow: hidden;
      border: none;
      margin-top: 8px;
    }

    .auth-login-btn::before {
      content: "";
      position: absolute;
      inset: -45%;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 250deg,
        rgba(255, 255, 255, 0.12) 280deg,
        rgba(255, 255, 255, 0.95) 320deg,
        #9fd4c8 340deg,
        transparent 360deg
      );
      z-index: -2;
      animation: authBtnGlowSpin 2.2s linear infinite;
      pointer-events: none;
    }

    .auth-login-btn::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: calc(var(--r-lg) - 1px);
      background: var(--ink);
      z-index: -1;
      pointer-events: none;
      transition: background 0.18s ease;
    }

    .auth-login-btn:hover::after {
      background: var(--ink-2);
    }

    @keyframes authBtnGlowSpin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      .auth-page {
        grid-template-columns: 1fr;
        grid-template-rows: min(46vh, 380px) 1fr;
      }

      .auth-left {
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px 28px 3.5rem;
      }

      .auth-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        position: absolute;
        top: max(1.5rem, calc(env(safe-area-inset-top, 0px) + 1rem));
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        font-family: "DM Sans", sans-serif;
        font-size: 12px;
        font-weight: 500;
        color: #fff;
        background: transparent;
        border: none;
        border-radius: 999px;
        padding: 8px 20px;
        white-space: nowrap;
        isolation: isolate;
        overflow: hidden;
      }

      .auth-badge::before {
        content: "";
        position: absolute;
        inset: -120%;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          transparent 240deg,
          rgba(255, 255, 255, 0.15) 280deg,
          rgba(255, 255, 255, 0.95) 320deg,
          #9fd4c8 345deg,
          transparent 360deg
        );
        z-index: -2;
        animation: authBtnGlowSpin 2.2s linear infinite;
        pointer-events: none;
      }

      .auth-badge::after {
        content: "";
        position: absolute;
        inset: 1.5px;
        border-radius: inherit;
        background: var(--brand-bg);
        z-index: -1;
        pointer-events: none;
      }

      .auth-brand-fill {
        position: relative;
        inset: auto;
        z-index: 1;
        width: 100%;
        max-width: min(280px, 78vw);
        height: auto;
        padding: 0;
      }

      .auth-wave {
        display: block;
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        width: 100%;
        height: clamp(56px, 14vw, 78px);
        z-index: 2;
        pointer-events: none;
      }

      .auth-right {
        padding: 28px 28px calc(40px + env(safe-area-inset-bottom, 0px));
        background: #fff;
      }

      .auth-title {
        font-size: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .login-flow .form-group input:focus {
        animation: none;
        border-color: var(--ink);
        background-image: none;
        box-shadow: 0 0 0 3px rgba(61, 107, 115, 0.12);
      }

      .auth-login-btn::before,
      .auth-badge::before {
        animation: none !important;
        opacity: 0 !important;
      }

      .auth-badge {
        border: 1.5px solid rgba(255, 255, 255, 0.85);
      }
    }
  </style>
</head>
<body class="login-flow">

<main class="page">
  <div class="auth-page">
    <div class="auth-left">
      <span class="auth-badge">Set your password</span>
      <img
        src="../images/veriflo-brand.png"
        alt="veriflo — Accurate. Timely. Transparent."
        class="auth-brand-fill"
        decoding="async"
      />
      <svg class="auth-wave" viewBox="0 0 430 90" preserveAspectRatio="none" aria-hidden="true">
        <path fill="#ffffff" d="M0,48 C70,14 160,6 250,32 C320,52 380,18 430,26 L430,90 L0,90 Z"/>
      </svg>
    </div>

    <div class="auth-right">
      <div class="auth-form-wrap">
        <div class="auth-title">Welcome to VeriFlow</div>
        <p class="auth-sub">Please set a new password to continue.</p>

        <div class="auth-notice">
          <i class="ti ti-shield-lock"></i>
          <span>You logged in with a temporary password. Choose a new one to access your dashboard.</span>
        </div>

        <form id="changePasswordForm" onsubmit="handleChangePassword(event)" novalidate>
          <div class="form-group" id="grp-currentPassword">
            <label for="currentPassword">Temporary password</label>
            <input type="password" id="currentPassword" placeholder="The temporary password you logged in with" autocomplete="current-password"/>
            <div class="form-error">Please enter your temporary password.</div>
          </div>
          <div class="form-group" id="grp-newPassword">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" placeholder="At least 8 characters" autocomplete="new-password"/>
            <div class="form-error">Password must be at least 8 characters.</div>
          </div>
          <div class="form-group" id="grp-confirmPassword">
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter your new password" autocomplete="new-password"/>
            <div class="form-error">Passwords do not match.</div>
          </div>
          <button type="submit" class="btn btn-ink btn-full auth-login-btn" id="changePasswordBtn">
            Set password &amp; continue <i class="ti ti-arrow-right"></i>
          </button>
        </form>

        <div class="auth-footer">
          <a href="#" onclick="VF.logout(); return false;">Log out instead</a>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="../js/app.js?v=13"></script>
<script>
  VF.pageIn();

  // Guard — only accessible if logged in
  if (!VF.requireAuth('login.html')) {
    // requireAuth already redirects; stop further execution
    throw new Error('Not authenticated');
  }

  async function handleChangePassword(e) {
    e.preventDefault();

    const currentPassword = document.getElementById('currentPassword').value;
    const newPassword     = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    const valid = VF.validateForm([
      { id: 'currentPassword', check: v => v.length >= 1, msg: 'Please enter your temporary password.' },
      { id: 'newPassword',     check: v => v.length >= 8, msg: 'Password must be at least 8 characters.' },
      { id: 'confirmPassword', check: v => v === newPassword, msg: 'Passwords do not match.' },
    ]);
    if (!valid) return;

    const btn = document.getElementById('changePasswordBtn');
    const originalHTML = btn.innerHTML;
    btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px"></div> Updating…';
    btn.classList.add('btn-disabled');

    try {
      const data = await VF.apiFetch('/auth/change-password', {
        method: 'PATCH',
        body: { currentPassword, newPassword, confirmPassword },
      });

      if (data.token) {
        VF.setToken(data.token);
      }

      VF.toast('Password updated successfully.', 'ok');

      const role = data.role || VF.roleFromToken();
      if (role === 'admin') {
        VF.navigate('admin-dashboard.html');
      } else if (role === 'tutor') {
        if (typeof VF.routeTutor === 'function') {
          VF.routeTutor({
            applicationStatus: data.applicationStatus ?? null,
            onboardingComplete: !!data.onboardingComplete,
          });
          VF.fetchTutorRouteState().catch(() => {});
        } else {
          VF.navigate('dashboard.html');
        }
      } else {
        VF.navigate('lecturer-dashboard.html');
      }

    } catch (err) {
      btn.innerHTML = originalHTML;
      btn.classList.remove('btn-disabled');
      VF.toast(err.errors ? err.errors[0] : 'Could not update password. Please try again.', 'err');
    }
  }
</script>
</body>
</html>
